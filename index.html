test<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nakliye Haritası</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #e9eef5;
    }

    .panel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      width: 340px;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.18);
    }

    .panel h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .panel p {
      margin: 0 0 15px;
      font-size: 13px;
      color: #667085;
    }

    input {
      width: 100%;
      height: 44px;
      margin-bottom: 10px;
      padding: 0 12px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      box-sizing: border-box;
      outline: none;
    }

    button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: #1264e8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #667085;
    }

    @media (max-width: 600px) {
      .panel {
        top: 10px;
        left: 10px;
        right: 10px;
        width: auto;
      }
    }
  </style>
</head>

<body>

<div id="map"></div>

<div class="panel">
  <h2>🚚 Nakliye Haritası</h2>
  <p>Canlı konum ve nakliye rotası</p>

  <input
    id="from"
    type="text"
    placeholder="Nereden?"
  >

  <input
    id="to"
    type="text"
    placeholder="Nereye?"
  >

  <button onclick="getLocation()">
    Konumumu Bul
  </button>

  <div id="status">
    Harita yükleniyor...
  </div>
</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>
  window.onload = function () {

    var status = document.getElementById("status");

    if (typeof L === "undefined") {
      status.innerHTML = "Leaflet yüklenemedi.";
      return;
    }

    var map = L.map("map").setView(
      [41.0082, 28.9784],
      11
    );

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "© OpenStreetMap"
      }
    ).addTo(map);

    L.marker([41.0082, 28.9784])
      .addTo(map)
      .bindPopup("İstanbul")
      .openPopup();

    status.innerHTML = "✓ Harita başarıyla yüklendi";

    window.getLocation = function () {

      status.innerHTML = "Konum aranıyor...";

      if (!navigator.geolocation) {
        status.innerHTML =
          "Bu tarayıcı konum özelliğini desteklemiyor.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {

          var lat = position.coords.latitude;
          var lng = position.coords.longitude;

          document.getElementById("from").value =
            lat.toFixed(6) + ", " + lng.toFixed(6);

          L.marker([lat, lng])
            .addTo(map)
            .bindPopup("Mevcut Konumunuz")
            .openPopup();

          map.setView([lat, lng], 15);

          status.innerHTML =
            "✓ Konumunuz bulundu";
        },

        function(error) {
          status.innerHTML =
            "Konum alınamadı. Konum iznini kontrol edin.";
        },

        {
          enableHighAccuracy: true,
          timeout: 10000
        }
      );
    };
  };
</script>

</body>
</html>
