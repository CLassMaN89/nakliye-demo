<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nakliye Canlı Rota</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    body {
      overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #e5e9f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #0f62fe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
    }

    .gps-state {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #667085;
      background: #f7f9fc;
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid #e8ecf2;
    }

    .gps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .gps-dot.active {
      background: #16a34a;
      box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.12);
    }

    /* =========================
       MAP
    ========================= */

    #map {
      position: absolute;
      top: 68px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }

    /* =========================
       ROUTE PANEL
    ========================= */

    .route-panel {
      position: fixed;
      top: 92px;
      left: 24px;
      width: 390px;
      max-height: calc(100vh - 116px);
      overflow-y: auto;
      background: rgba(255,255,255,.97);
      border: 1px solid #e5e9f0;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(16, 24, 40, 0.14);
      padding: 20px;
      z-index: 900;
      backdrop-filter: blur(16px);
    }

    .panel-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .panel-desc {
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .location-group {
      position: relative;
      padding-left: 24px;
    }

    .location-line {
      position: absolute;
      width: 2px;
      height: 58px;
      background: #dbe2ea;
      left: 7px;
      top: 23px;
    }

    .field {
      position: relative;
      margin-bottom: 13px;
    }

    .field-dot {
      position: absolute;
      left: -22px;
      top: 18px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      border: 3px solid #0f62fe;
      z-index: 2;
    }

    .field-dot.destination {
      border-color: #ef4444;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #667085;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      transition: .2s;
    }

    .input-wrap:focus-within {
      background: white;
      border-color: #0f62fe;
      box-shadow: 0 0 0 4px rgba(15, 98, 254, .08);
    }

    .input-wrap input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: none;
      outline: none;
      background: transparent;
      color: #172033;
      font-size: 14px;
    }

    .gps-btn {
      border: none;
      background: transparent;
      width: 44px;
      height: 44px;
      cursor: pointer;
      color: #0f62fe;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gps-btn svg {
      width: 20px;
      height: 20px;
    }

    .suggestions {
      display: none;
      background: white;
      border: 1px solid #e5e9f0;
      border-radius: 12px;
      margin-top: 5px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(16,24,40,.12);
    }

    .suggestion {
      padding: 11px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f0f2f5;
      font-size: 13px;
      line-height: 1.35;
    }

    .suggestion:last-child {
      border-bottom: none;
    }

    .suggestion:hover {
      background: #f6f9ff;
    }

    /* =========================
       BUTTON
    ========================= */

    .route-btn {
      width: 100%;
      height: 48px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: #0f62fe;
      color: white;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: .2s;
    }

    .route-btn:hover {
      background: #0754dc;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15,98,254,.22);
    }

    .route-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    /* =========================
       ROUTE INFO
    ========================= */

    .route-info {
      display: none;
      margin-top: 18px;
      border-top: 1px solid #edf
